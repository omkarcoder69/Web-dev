<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
      }
      html, body {
        height: 100%;
        width: 100%;
      }
      h1 {
        font-size: 50px;
        font-weight: 900;
        background-image: url(images/nature3.jpg); /* Make sure the image exists */
        background-size: cover;
        background-position: center;
        background-clip: text;
        -webkit-background-clip: text; /* Webkit prefix for Safari/Chrome */
        color: transparent; /* Make the text transparent so background is visible */
        display: inline-block;
      }
    </style>
  </head>
  <body>
    <h1>Omkar Mahadik</h1>
  </body>
</html>
