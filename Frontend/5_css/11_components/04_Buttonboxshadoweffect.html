<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
          padding: 0;
          margin: 0;
          box-sizing: border-box;
        }
        html,body{
            height: 100%;
            width: 100%;
        }
        button{
            font-size: 18px;
            font-weight: 700;
            border-radius: 3px;
            padding: 12px 20px;
            margin: 50px;
            border: none;
            color: #fff;
            background-color: lightseagreen;
            transition: all ease 0.5s;
        }
        button:hover{
            box-shadow: 5px 5px 0px #000;
        }
    </style>
</head>
<body>
    <button>Explore now</button>
</body>
</html>
