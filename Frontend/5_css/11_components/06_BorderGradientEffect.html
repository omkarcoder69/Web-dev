<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        width: 100%;
      }
      #gola{
        height: 100px;
        width: 100px;
        border-radius: 50%;
        background:linear-gradient(yellow, orange,pink,purple ,blue     );
        padding:5px;
        
      }
      #gola img{
         height: 100%;
         width: 100%;
         object-fit: cover;
         border-radius: 50%;
      }
    </style>
</head>
<body>
    <div id="gola">
        <img src="images/rose.jpg" alt="rose">
    </div>
</body>
</html>
